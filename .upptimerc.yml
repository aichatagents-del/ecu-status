owner: aichatagents-del
repo: ecu-status

sites:
  - name: HERMES API
    url: https://hermes-ecu.onrender.com/health
    expectedStatusCodes:
      - 200
    method: GET
    maxResponseTime: 30000

  - name: n8n editor
    url: https://n8n-ecu.onrender.com/healthz
    expectedStatusCodes:
      - 200
      - 401
      - 403
    method: GET
    maxResponseTime: 30000

status-website:
  baseUrl: /ecu-status/
  cname: ""
  name: ECU Chip Repair - Status
  introTitle: Estado en tiempo real de la infraestructura
  introMessage: >
    Monitoreo automatico cada 5 minutos de los servicios de ECU Chip Repair.
    Historial completo de incidentes disponible en el tab Issues.
  navbar:
    - title: Estado
      href: /
    - title: GitHub
      href: https://github.com/aichatagents-del/ecu-status

notifications:
  - type: telegram
    token: $TELEGRAM_BOT_TOKEN
    chat: $TELEGRAM_CHAT_ID

user-agent: "ECU-Status-Upptime/1.0 (compatible; Monitor)"

assignees:
  - aichatagents-del

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updates: "0 3 * * *"
  updateTemplate: "0 0 * * 3"


